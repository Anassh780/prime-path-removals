  />
  <path
    d="M20 38.5L31 37.5V39.5L20 40.5V38.5Z"
    fill="url(#phr-orange)"
  />

  <!-- Wheels -->
  <circle cx="27" cy="44" r="3.2" fill="#04101f" stroke="#ffffff" stroke-width="1" />
  <circle cx="48" cy="44" r="3.2" fill="#04101f" stroke="#ffffff" stroke-width="1" />
  <circle cx="27" cy="44" r="1.2" fill="#ffffff" />
  <circle cx="48" cy="44" r="1.2" fill="#ffffff" />
