<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prime House Removals">
  <defs>
    <linearGradient id="phr-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Container / Background tile for favicon -->
  <rect width="64" height="64" rx="14" fill="#04101f" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Dynamic Orange Orbital Swoosh -->
  <path
