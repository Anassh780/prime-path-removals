  />
  <rect x="36" y="18" width="4.5" height="7" rx="0.5" fill="#ffffff" />
  
  <!-- Orange Inner Gable Peak -->
  <path
    d="M23 30L31 23L39 30H35L31 26.5L27 30H23Z"
